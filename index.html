<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michette Artisanal Bakery</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts einbinden -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Hintergrund-Welle (SVG) -->
    <div class="background-curve">
        <svg viewBox="0 0 1440 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <path d="M0,800 L0,400 C300,700 600,850 900,500 C1100,250 1300,400 1440,450 L1440,800 Z" fill="#FFF8EC"/>
        </svg>
    </div>

    <!-- Navigation -->
    <header>
        <div class="logo">Pâtisserie Rawmilk</div>
        <nav>
            <ul>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Gift Cards</a></li>
                <li><a href="#">Our Story</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Catering</a></li>
            </ul>
        </nav>
        <a href="#" class="btn-nav">Order Now</a>
    </header>

    <!-- Hero Section -->
    <main class="hero">
        
        <!-- Linker Inhalt (Text) -->
        <div class="hero-content">
            <h1>Make your LOTUS <br>dream come true</h1>
            <p>Michette is an artisanal French bakery. We are now open at 164 Broadway in Somerville!</p>
        </div>

        <!-- Rechter Inhalt (Bilder) -->
        <div class="hero-visuals">

            <!-- Der Hauptkreis mit dem Kuchen -->
            <div class="circle-container">
                <img src="bild1.jpeg" alt="Cheesecake" class="main-cake">
            </div>

            <!-- Schwebende Croissants (Platzhalter) -->
            <!-- Hinweis: Hier solltest du transparente PNGs verwenden -->
            <img src="bild2.png" class="croissant croissant-left" alt="Croissant">
            <img src="bild2.png" class="croissant croissant-right" alt="Croissant">
        </div>

    </main>

</body>
</html>
